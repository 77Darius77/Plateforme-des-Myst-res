<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1400" width="1920" height="1400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <pattern id="kabbalahDots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1" fill="#334155"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1400" fill="url(#bgGrad)"/>
  <rect width="1920" height="1400" fill="url(#grid)" opacity="0.4"/>
  <rect width="1920" height="1400" fill="url(#kabbalahDots)" opacity="0.3"/>

  <!-- Header -->
  <rect x="80" y="40" width="1760" height="120" rx="16" fill="url(#headerGrad)" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
  <circle cx="130" cy="100" r="6" fill="#fbbf24" filter="url(#glow)"/>
  <text x="160" y="88" font-family="JetBrains Mono, monospace" font-size="28" fill="#fbbf24" font-weight="bold">LES 22 ARCHÉTYPES</text>
  <text x="160" y="125" font-family="JetBrains Mono, monospace" font-size="16" fill="#94a3b8">Numérologie Cabalistique — Méthode Raúl Durán — Chaque nombre est une force ET un défi</text>

  <!-- Column labels -->
  <text x="305" y="195" font-family="JetBrains Mono, monospace" font-size="16" fill="#fbbf24" font-weight="bold" text-anchor="middle">COLONNE GAUCHE — N° 1 à 11</text>
  <text x="1235" y="195" font-family="JetBrains Mono, monospace" font-size="16" fill="#fbbf24" font-weight="bold" text-anchor="middle">COLONNE DROITE — N° 12 à 22</text>

  <!-- Separator line down the middle -->
  <line x1="960" y1="210" x2="960" y2="1270" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ======================================================================== -->
  <!-- LEFT COLUMN — Archétypes 1 à 11                                         -->
  <!-- Cell: x=40, w=530, h=80. Spacing: 95px (80+15). Start y=220             -->
  <!-- Number: 1-digit x=80, 2-digit x=76. Text: x=135                         -->
  <!-- ======================================================================== -->

  <!-- 1 — Row 0, y=220 -->
  <rect x="40" y="220" width="530" height="80" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="80" y="248" font-family="JetBrains Mono, monospace" font-size="30" fill="#fbbf24" font-weight="bold">1</text>
  <text x="135" y="246" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Leader, pionnier, indépendance</text>
  <text x="135" y="274" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Égoïsme, domination</text>

  <!-- 2 — Row 1, y=315 -->
  <rect x="40" y="315" width="530" height="80" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="80" y="343" font-family="JetBrains Mono, monospace" font-size="30" fill="#22d3ee" font-weight="bold">2</text>
  <text x="135" y="341" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Coopération, diplomatie, patience</text>
  <text x="135" y="369" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Dépendance affective</text>

  <!-- 3 — Row 2, y=410 -->
  <rect x="40" y="410" width="530" height="80" rx="10" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="1.2"/>
  <text x="80" y="438" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb923c" font-weight="bold">3</text>
  <text x="135" y="436" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Communication, créativité, joie</text>
  <text x="135" y="464" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Dispersion, superficialité</text>

  <!-- 4 — Row 3, y=505 -->
  <rect x="40" y="505" width="530" height="80" rx="10" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="80" y="533" font-family="JetBrains Mono, monospace" font-size="30" fill="#a78bfa" font-weight="bold">4</text>
  <text x="135" y="531" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Structure, ordre, discipline</text>
  <text x="135" y="559" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Rigidité, peur du changement</text>

  <!-- 5 — Row 4, y=600 -->
  <rect x="40" y="600" width="530" height="80" rx="10" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.2"/>
  <text x="80" y="628" font-family="JetBrains Mono, monospace" font-size="30" fill="#34d399" font-weight="bold">5</text>
  <text x="135" y="626" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Liberté, aventure, adaptabilité</text>
  <text x="135" y="654" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Instabilité, excès</text>

  <!-- 6 — Row 5, y=695 -->
  <rect x="40" y="695" width="530" height="80" rx="10" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="80" y="723" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb7185" font-weight="bold">6</text>
  <text x="135" y="721" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Responsabilité, famille, service</text>
  <text x="135" y="749" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Mensonge (6 ↔ 9)</text>

  <!-- 7 — Row 6, y=790 -->
  <rect x="40" y="790" width="530" height="80" rx="10" fill="rgba(148,163,184,0.07)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="818" font-family="JetBrains Mono, monospace" font-size="30" fill="#94a3b8" font-weight="bold">7</text>
  <text x="135" y="816" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Sagesse intérieure, analyse, spiritualité</text>
  <text x="135" y="844" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Isolement, froideur</text>

  <!-- 8 — Row 7, y=885 -->
  <rect x="40" y="885" width="530" height="80" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="80" y="913" font-family="JetBrains Mono, monospace" font-size="30" fill="#fbbf24" font-weight="bold">8</text>
  <text x="135" y="911" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Pouvoir, conquête, stratégie</text>
  <text x="135" y="939" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Avidité, manipulation</text>

  <!-- 9 — Row 8, y=980 -->
  <rect x="40" y="980" width="530" height="80" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="80" y="1008" font-family="JetBrains Mono, monospace" font-size="30" fill="#22d3ee" font-weight="bold">9</text>
  <text x="135" y="1006" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Vérité, sagesse universelle</text>
  <text x="135" y="1034" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Mensonge (9 ↔ 6)</text>

  <!-- 10 — Row 9, y=1075 (2-digit) -->
  <rect x="40" y="1075" width="530" height="80" rx="10" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="76" y="1103" font-family="JetBrains Mono, monospace" font-size="30" fill="#a78bfa" font-weight="bold">10</text>
  <text x="135" y="1101" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Compréhension : jamais seul·e</text>
  <text x="135" y="1129" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Peur de la solitude</text>

  <!-- 11 — Row 10, y=1170 (2-digit) -->
  <rect x="40" y="1170" width="530" height="80" rx="10" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="1.2"/>
  <text x="76" y="1198" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb923c" font-weight="bold">11</text>
  <text x="135" y="1196" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Intuition, connexion inter-mondes</text>
  <text x="135" y="1224" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Dépendance, nier son intuition</text>

  <!-- ======================================================================== -->
  <!-- RIGHT COLUMN — Archétypes 12 à 22                                       -->
  <!-- Cell: x=970, w=530, h=80. Spacing: 95px. Start y=220                    -->
  <!-- Number (2-digit): x=1006. Text: x=1065                                   -->
  <!-- Special: 13 (AMOUR) and 22 (JOKER) have thicker stroke                   -->
  <!-- ======================================================================== -->

  <!-- 12 — Row 0, y=220 -->
  <rect x="970" y="220" width="530" height="80" rx="10" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.2"/>
  <text x="1006" y="248" font-family="JetBrains Mono, monospace" font-size="30" fill="#34d399" font-weight="bold">12</text>
  <text x="1065" y="246" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Sacrifice, grande capacité de travail</text>
  <text x="1065" y="274" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Esclavage — ne pas savoir dire non</text>

  <!-- 13 — Row 1, y=315 — Special: highlighted AMOUR -->
  <rect x="970" y="315" width="530" height="80" rx="10" fill="rgba(251,113,133,0.12)" stroke="#fb7185" stroke-width="2"/>
  <text x="1006" y="343" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb7185" font-weight="bold">13</text>
  <text x="1065" y="341" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Transformation, Amour (Ahavá), le Phénix</text>
  <text x="1065" y="369" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Transformation douloureuse prolongée</text>

  <!-- 14 — Row 2, y=410 -->
  <rect x="970" y="410" width="530" height="80" rx="10" fill="rgba(148,163,184,0.07)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1006" y="438" font-family="JetBrains Mono, monospace" font-size="30" fill="#94a3b8" font-weight="bold">14</text>
  <text x="1065" y="436" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Engagement, respect des contrats</text>
  <text x="1065" y="464" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Fuir les engagements</text>

  <!-- 15 — Row 3, y=505 -->
  <rect x="970" y="505" width="530" height="80" rx="10" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="1006" y="533" font-family="JetBrains Mono, monospace" font-size="30" fill="#fbbf24" font-weight="bold">15</text>
  <text x="1065" y="531" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Passion (tous domaines)</text>
  <text x="1065" y="559" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Addictions, surtout sexuelles</text>

  <!-- 16 — Row 4, y=600 -->
  <rect x="970" y="600" width="530" height="80" rx="10" fill="rgba(34,211,238,0.06)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="1006" y="628" font-family="JetBrains Mono, monospace" font-size="30" fill="#22d3ee" font-weight="bold">16</text>
  <text x="1065" y="626" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Perfectionnisme sain, excellence</text>
  <text x="1065" y="654" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Auto-exigence excessive, souffrance</text>

  <!-- 17 — Row 5, y=695 -->
  <rect x="970" y="695" width="530" height="80" rx="10" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="1.2"/>
  <text x="1006" y="723" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb923c" font-weight="bold">17</text>
  <text x="1065" y="721" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Douceur, tactilité, chaleur humaine</text>
  <text x="1065" y="749" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Froideur, absence de contact</text>

  <!-- 18 — Row 6, y=790 -->
  <rect x="970" y="790" width="530" height="80" rx="10" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="1006" y="818" font-family="JetBrains Mono, monospace" font-size="30" fill="#a78bfa" font-weight="bold">18</text>
  <text x="1065" y="816" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Décodage secrets familiaux, rêves</text>
  <text x="1065" y="844" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Secrets non révélés, ombre familiale</text>

  <!-- 19 — Row 7, y=885 -->
  <rect x="970" y="885" width="530" height="80" rx="10" fill="rgba(52,211,153,0.06)" stroke="#34d399" stroke-width="1.2"/>
  <text x="1006" y="913" font-family="JetBrains Mono, monospace" font-size="30" fill="#34d399" font-weight="bold">19</text>
  <text x="1065" y="911" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Rayonnement, exemplarité, conscience</text>
  <text x="1065" y="939" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Implosion, problème d'estime de soi</text>

  <!-- 20 — Row 8, y=980 -->
  <rect x="970" y="980" width="530" height="80" rx="10" fill="rgba(251,113,133,0.08)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="1006" y="1008" font-family="JetBrains Mono, monospace" font-size="30" fill="#fb7185" font-weight="bold">20</text>
  <text x="1065" y="1006" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Reconnaissance, titres, diplômes</text>
  <text x="1065" y="1034" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : « Qui est mon père ? » — absence</text>

  <!-- 21 — Row 9, y=1075 -->
  <rect x="970" y="1075" width="530" height="80" rx="10" fill="rgba(148,163,184,0.07)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1006" y="1103" font-family="JetBrains Mono, monospace" font-size="30" fill="#94a3b8" font-weight="bold">21</text>
  <text x="1065" y="1101" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Vision globale, langues, liberté</text>
  <text x="1065" y="1129" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Esclavage, ne pas se sentir libre</text>

  <!-- 22 — Row 10, y=1170 — Joker, special highlight -->
  <rect x="970" y="1170" width="530" height="80" rx="10" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="2"/>
  <text x="1006" y="1198" font-family="JetBrains Mono, monospace" font-size="30" fill="#fbbf24" font-weight="bold">22</text>
  <text x="1065" y="1196" font-family="JetBrains Mono, monospace" font-size="16" fill="#34d399" font-weight="bold">Le Joker — toutes possibilités, libre arbitre</text>
  <text x="1065" y="1224" font-family="JetBrains Mono, monospace" font-size="13" fill="#94a3b8">◆ Défi : Chaos, dispersion, chaos sexuel</text>

  <!-- Legend -->
  <rect x="100" y="1290" width="560" height="30" rx="6" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="0.8"/>
  <text x="120" y="1311" font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">◆ Force (Don) en vert ◆ Défi (Ticún) en gris ◆ Nombre spécial en surbrillance ◆</text>

  <!-- Footer -->
  <text x="960" y="1340" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569" text-anchor="middle">Géolie &amp; Blaise — Juin 2026 — Source : Podcast Lo Grande, Raúl Durán</text>
</svg>
