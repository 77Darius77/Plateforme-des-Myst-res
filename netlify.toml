[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ── Headers de sécurité globaux ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.gumroad.com; frame-ancestors 'none'"

# ── Cache statique ────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects .html → URLs propres (compatibilité liens externes)
[[redirects]]
  from = "/:section/index.html"
  to = "/:section/"
  status = 301
  force = false

[[redirects]]
  from = "/:section/:page.html"
  to = "/:section/:page/"
  status = 301
  force = false

[[redirects]]
  from = "/:page.html"
  to = "/:page/"
  status = 301
  force = false
