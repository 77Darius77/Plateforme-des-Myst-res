[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Headers de sécurité globaux ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.gumroad.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    # HSTS progressif (étape 8a du PRD audit) : max-age volontairement bas (5 min).
    # Ne PAS ajouter includeSubDomains/preload à ce stade — la préinscription à la
    # liste de préchargement des navigateurs est quasi irréversible. Augmenter par
    # paliers sur plusieurs déploiements futurs : 1 jour → 1 mois → 1 an.
    Strict-Transport-Security = "max-age=300"

# ── Cache statique ────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects .html → URLs propres (compatibilité liens externes)
# Du plus spécifique (3 segments) au moins spécifique, catch-all 404 en dernier.
[[redirects]]
  from = "/:section/:page/index.html"
  to = "/:section/:page/"
  status = 301
  force = false

[[redirects]]
  from = "/:section/:page/:sub.html"
  to = "/:section/:page/:sub/"
  status = 301
  force = false

[[redirects]]
  from = "/:section/index.html"
  to = "/:section/"
  status = 301
  force = false

[[redirects]]
  from = "/:section/:page.html"
  to = "/:section/:page/"
  status = 301
  force = false

[[redirects]]
  from = "/:page.html"
  to = "/:page/"
  status = 301
  force = false

# Catch-all : force un vrai statut HTTP 404 (doit rester en dernier, sinon
# neutralise les redirections 301 ci-dessus — voir aussi public/_redirects supprimé,
# car les règles _redirects sont toujours évaluées avant celles de netlify.toml).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
