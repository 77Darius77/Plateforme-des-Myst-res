<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210" width="120" height="210">
  <defs>
    <!-- Fond principal dégradé -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="40%" style="stop-color:#12102a"/>
      <stop offset="100%" style="stop-color:#05050f"/>
    </linearGradient>
    <!-- Halo central doré -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.18"/>
      <stop offset="60%" style="stop-color:#8b6914;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0"/>
    </radialGradient>
    <!-- Halo coins -->
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a2080;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4a2080;stop-opacity:0"/>
    </radialGradient>
    <!-- Filtre lueur dorée -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="120" height="210" rx="6" ry="6" fill="url(#bgGrad)"/>

  <!-- Halos coins -->
  <rect x="-20" y="-20" width="70" height="70" fill="url(#cornerGlow)" opacity="0.6"/>
  <rect x="70" y="-20" width="70" height="70" fill="url(#cornerGlow)" opacity="0.6"/>
  <rect x="-20" y="160" width="70" height="70" fill="url(#cornerGlow)" opacity="0.6"/>
  <rect x="70" y="160" width="70" height="70" fill="url(#cornerGlow)" opacity="0.6"/>

  <!-- Halo central -->
  <rect width="120" height="210" fill="url(#centerGlow)"/>

  <!-- Bordure extérieure dorée -->
  <rect x="3" y="3" width="114" height="204" rx="5" ry="5" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.8"/>
  <!-- Bordure intérieure fine -->
  <rect x="7" y="7" width="106" height="196" rx="3" ry="3" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>

  <!-- Étoiles de fond (petites, nombreuses) -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <!-- Étoiles minuscules -->
    <circle cx="15" cy="20" r="0.4" opacity="0.5"/>
    <circle cx="34" cy="12" r="0.3" opacity="0.6"/>
    <circle cx="52" cy="18" r="0.5" opacity="0.4"/>
    <circle cx="73" cy="9" r="0.3" opacity="0.7"/>
    <circle cx="89" cy="22" r="0.4" opacity="0.5"/>
    <circle cx="105" cy="14" r="0.3" opacity="0.6"/>
    <circle cx="11" cy="45" r="0.3" opacity="0.4"/>
    <circle cx="28" cy="38" r="0.5" opacity="0.6"/>
    <circle cx="44" cy="30" r="0.3" opacity="0.5"/>
    <circle cx="63" cy="40" r="0.4" opacity="0.7"/>
    <circle cx="82" cy="33" r="0.3" opacity="0.4"/>
    <circle cx="98" cy="44" r="0.5" opacity="0.6"/>
    <circle cx="110" cy="37" r="0.3" opacity="0.5"/>
    <circle cx="19" cy="62" r="0.4" opacity="0.6"/>
    <circle cx="38" cy="55" r="0.3" opacity="0.4"/>
    <circle cx="57" cy="68" r="0.5" opacity="0.7"/>
    <circle cx="76" cy="58" r="0.3" opacity="0.5"/>
    <circle cx="94" cy="65" r="0.4" opacity="0.6"/>
    <circle cx="108" cy="60" r="0.3" opacity="0.4"/>
    <circle cx="13" cy="82" r="0.5" opacity="0.5"/>
    <circle cx="31" cy="75" r="0.3" opacity="0.7"/>
    <circle cx="49" cy="85" r="0.4" opacity="0.4"/>
    <circle cx="68" cy="78" r="0.3" opacity="0.6"/>
    <circle cx="87" cy="88" r="0.5" opacity="0.5"/>
    <circle cx="103" cy="79" r="0.3" opacity="0.7"/>
    <circle cx="16" cy="100" r="0.4" opacity="0.6"/>
    <circle cx="35" cy="108" r="0.3" opacity="0.4"/>
    <circle cx="54" cy="100" r="0.5" opacity="0.5"/>
    <circle cx="72" cy="112" r="0.4" opacity="0.7"/>
    <circle cx="91" cy="104" r="0.3" opacity="0.4"/>
    <circle cx="107" cy="110" r="0.5" opacity="0.6"/>
    <circle cx="22" cy="122" r="0.3" opacity="0.5"/>
    <circle cx="41" cy="130" r="0.4" opacity="0.7"/>
    <circle cx="60" cy="120" r="0.3" opacity="0.4"/>
    <circle cx="79" cy="128" r="0.5" opacity="0.6"/>
    <circle cx="97" cy="118" r="0.3" opacity="0.5"/>
    <circle cx="112" cy="125" r="0.4" opacity="0.7"/>
    <circle cx="17" cy="142" r="0.5" opacity="0.4"/>
    <circle cx="36" cy="150" r="0.3" opacity="0.6"/>
    <circle cx="55" cy="140" r="0.4" opacity="0.5"/>
    <circle cx="74" cy="148" r="0.3" opacity="0.7"/>
    <circle cx="93" cy="138" r="0.5" opacity="0.4"/>
    <circle cx="109" cy="145" r="0.3" opacity="0.6"/>
    <circle cx="25" cy="162" r="0.4" opacity="0.5"/>
    <circle cx="43" cy="170" r="0.3" opacity="0.7"/>
    <circle cx="62" cy="160" r="0.5" opacity="0.4"/>
    <circle cx="81" cy="168" r="0.4" opacity="0.6"/>
    <circle cx="99" cy="158" r="0.3" opacity="0.5"/>
    <circle cx="114" cy="165" r="0.5" opacity="0.7"/>
    <circle cx="20" cy="182" r="0.3" opacity="0.4"/>
    <circle cx="39" cy="188" r="0.4" opacity="0.6"/>
    <circle cx="58" cy="178" r="0.3" opacity="0.5"/>
    <circle cx="77" cy="190" r="0.5" opacity="0.7"/>
    <circle cx="96" cy="180" r="0.3" opacity="0.4"/>
    <circle cx="111" cy="186" r="0.4" opacity="0.6"/>
  </g>

  <!-- Étoiles moyennes avec lueur -->
  <g filter="url(#starGlow)">
    <circle cx="22" cy="30" r="0.8" fill="#e8d5a0" opacity="0.7"/>
    <circle cx="98" cy="55" r="0.8" fill="#e8d5a0" opacity="0.6"/>
    <circle cx="15" cy="130" r="0.9" fill="#c8b8e0" opacity="0.7"/>
    <circle cx="105" cy="170" r="0.8" fill="#e8d5a0" opacity="0.6"/>
    <circle cx="60" cy="28" r="0.9" fill="#ffffff" opacity="0.5"/>
    <circle cx="25" cy="185" r="0.8" fill="#c8b8e0" opacity="0.7"/>
    <circle cx="100" cy="130" r="0.9" fill="#e8d5a0" opacity="0.6"/>
    <circle cx="15" cy="80" r="0.8" fill="#c8b8e0" opacity="0.7"/>
  </g>

  <!-- Motif central : étoile à 8 branches stylisée -->
  <g transform="translate(60,105)" filter="url(#glow)">
    <!-- Branches principales -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#d4af37" stroke-width="0.6" opacity="0.7"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#d4af37" stroke-width="0.6" opacity="0.7"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#d4af37" stroke-width="0.4" opacity="0.5"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#d4af37" stroke-width="0.4" opacity="0.5"/>

    <!-- Cercles concentriques -->
    <circle r="28" fill="none" stroke="#d4af37" stroke-width="0.4" opacity="0.25"/>
    <circle r="20" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.3"/>
    <circle r="13" fill="none" stroke="#d4af37" stroke-width="0.4" opacity="0.4"/>
    <circle r="6" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>

    <!-- Pentagone / symboles sacrés -->
    <polygon points="0,-22 20.9,7.2 12.9,18.8 -12.9,18.8 -20.9,7.2" fill="none" stroke="#9b72cf" stroke-width="0.4" opacity="0.4"/>

    <!-- Étoile centrale -->
    <polygon points="0,-8 1.9,-2.6 7.6,-2.6 3.1,1 4.7,6.4 0,3.2 -4.7,6.4 -3.1,1 -7.6,-2.6 -1.9,-2.6" fill="#d4af37" opacity="0.9"/>

    <!-- Points aux branches de l'étoile à 8 branches -->
    <circle cx="0" cy="-28" r="1.2" fill="#d4af37" opacity="0.8"/>
    <circle cx="28" cy="0" r="1.2" fill="#d4af37" opacity="0.8"/>
    <circle cx="0" cy="28" r="1.2" fill="#d4af37" opacity="0.8"/>
    <circle cx="-28" cy="0" r="1.2" fill="#d4af37" opacity="0.8"/>
    <circle cx="20" cy="-20" r="0.8" fill="#c8a0e0" opacity="0.7"/>
    <circle cx="20" cy="20" r="0.8" fill="#c8a0e0" opacity="0.7"/>
    <circle cx="-20" cy="20" r="0.8" fill="#c8a0e0" opacity="0.7"/>
    <circle cx="-20" cy="-20" r="0.8" fill="#c8a0e0" opacity="0.7"/>
  </g>

  <!-- Petites étoiles à 4 branches dans les coins -->
  <g fill="#d4af37" opacity="0.6" filter="url(#glow)">
    <!-- Coin haut-gauche -->
    <g transform="translate(16,16)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#d4af37" opacity="0.8"/>
    </g>
    <!-- Coin haut-droit -->
    <g transform="translate(104,16)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#d4af37" opacity="0.8"/>
    </g>
    <!-- Coin bas-gauche -->
    <g transform="translate(16,194)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#d4af37" opacity="0.8"/>
    </g>
    <!-- Coin bas-droit -->
    <g transform="translate(104,194)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#d4af37" opacity="0.8"/>
    </g>
  </g>

  <!-- Constellation : petits points reliés -->
  <g opacity="0.35" stroke="#9b72cf" stroke-width="0.3" fill="none">
    <polyline points="22,50 38,42 55,58 72,48 90,62"/>
    <polyline points="30,155 48,162 65,152 82,160 100,150"/>
  </g>
  <g fill="#c8a0e0" opacity="0.5" filter="url(#starGlow)">
    <circle cx="22" cy="50" r="0.7"/>
    <circle cx="38" cy="42" r="0.5"/>
    <circle cx="55" cy="58" r="0.7"/>
    <circle cx="72" cy="48" r="0.5"/>
    <circle cx="90" cy="62" r="0.7"/>
    <circle cx="30" cy="155" r="0.7"/>
    <circle cx="48" cy="162" r="0.5"/>
    <circle cx="65" cy="152" r="0.7"/>
    <circle cx="82" cy="160" r="0.5"/>
    <circle cx="100" cy="150" r="0.7"/>
  </g>

  <!-- Coin arrondi visible -->
  <rect x="3" y="3" width="114" height="204" rx="5" ry="5" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.5"/>
</svg>
