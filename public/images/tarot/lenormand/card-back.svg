<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 290">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D5A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A6852A"/>
    </linearGradient>
  </defs>

  <!-- Fond bordeaux -->
  <rect width="200" height="290" fill="#2D0A14"/>

  <!-- Lueur centrale -->
  <ellipse cx="100" cy="130" rx="120" ry="180" fill="url(#glow)"/>

  <!-- Texture subtile -->
  <g opacity="0.03">
    <line x1="0" y1="20" x2="200" y2="20" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="200" y2="40" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="200" y2="180" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="200" y2="200" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="220" x2="200" y2="220" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="200" y2="240" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="260" x2="200" y2="260" stroke="#D4AF37" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="200" y2="280" stroke="#D4AF37" stroke-width="0.5"/>
  </g>

  <!-- Cadre extérieur double -->
  <rect x="12" y="14" width="176" height="262" rx="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <rect x="18" y="20" width="164" height="250" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.5"/>

  <!-- Ornements d'angle -->
  <path d="M14,16 Q14,48 46,16" fill="none" stroke="#D4AF37" stroke-width="1.4" opacity="0.85"/>
  <path d="M186,16 Q186,48 154,16" fill="none" stroke="#D4AF37" stroke-width="1.4" opacity="0.85"/>
  <path d="M14,274 Q14,242 46,274" fill="none" stroke="#D4AF37" stroke-width="1.4" opacity="0.85"/>
  <path d="M186,274 Q186,242 154,274" fill="none" stroke="#D4AF37" stroke-width="1.4" opacity="0.85"/>

  <!-- Feuilles d'angle -->
  <path d="M30,30 Q25,20 35,18 Q45,22 38,32 Z" fill="#D4AF37" opacity="0.3"/>
  <path d="M170,30 Q175,20 165,18 Q155,22 162,32 Z" fill="#D4AF37" opacity="0.3"/>
  <path d="M30,260 Q25,270 35,272 Q45,268 38,258 Z" fill="#D4AF37" opacity="0.3"/>
  <path d="M170,260 Q175,270 165,272 Q155,268 162,258 Z" fill="#D4AF37" opacity="0.3"/>

  <!-- Médaillon central -->
  <ellipse cx="100" cy="130" rx="42" ry="55" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <ellipse cx="100" cy="130" rx="35" ry="46" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="100" cy="130" rx="28" ry="37" fill="none" stroke="#D4AF37" stroke-width="0.9" opacity="0.65"/>

  <!-- Fleur de lys stylisée -->
  <g transform="translate(100,125)" fill="none" stroke="#D4AF37" stroke-width="1.4" opacity="0.9">
    <!-- Tige -->
    <line x1="0" y1="-20" x2="0" y2="25"/>
    <!-- Pétale central -->
    <path d="M0,-22 Q3,-30 0,-38 Q-3,-30 0,-22"/>
    <!-- Pétales latéraux -->
    <path d="M0,-18 Q-8,-26 -12,-20 Q-6,-16 0,-18"/>
    <path d="M0,-18 Q8,-26 12,-20 Q6,-16 0,-18"/>
    <!-- Feuilles base -->
    <path d="M0,10 Q-10,5 -14,12 Q-7,14 0,10"/>
    <path d="M0,10 Q10,5 14,12 Q7,14 0,10"/>
  </g>

  <!-- Rinceaux latéraux -->
  <path d="M58,130 Q50,110 58,100 Q66,108 58,130" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.55"/>
  <path d="M142,130 Q150,110 142,100 Q134,108 142,130" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.55"/>
  <circle cx="58" cy="130" r="2" fill="#D4AF37" opacity="0.5"/>
  <circle cx="142" cy="130" r="2" fill="#D4AF37" opacity="0.5"/>

  <!-- Guirlande supérieure -->
  <path d="M72,55 Q80,45 90,48 Q100,50 100,48 Q100,50 110,48 Q120,45 128,55" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.45"/>
  <circle cx="85" cy="50" r="1.2" fill="#D4AF37" opacity="0.35"/>
  <circle cx="100" cy="48" r="1.5" fill="#D4AF37" opacity="0.4"/>
  <circle cx="115" cy="50" r="1.2" fill="#D4AF37" opacity="0.35"/>

  <!-- Guirlande inférieure -->
  <path d="M72,215 Q80,225 90,222 Q100,220 100,222 Q100,220 110,222 Q120,225 128,215" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.45"/>
  <circle cx="85" cy="222" r="1.2" fill="#D4AF37" opacity="0.35"/>
  <circle cx="100" cy="222" r="1.5" fill="#D4AF37" opacity="0.4"/>
  <circle cx="115" cy="222" r="1.2" fill="#D4AF37" opacity="0.35"/>

  <!-- Points décoratifs -->
  <circle cx="100" cy="70" r="1.8" fill="#D4AF37" opacity="0.45"/>
  <circle cx="100" cy="195" r="1.8" fill="#D4AF37" opacity="0.45"/>
  <circle cx="74" cy="130" r="1.2" fill="#D4AF37" opacity="0.35"/>
  <circle cx="126" cy="130" r="1.2" fill="#D4AF37" opacity="0.35"/>

  <!-- Petites étoiles -->
  <g fill="#D4AF37" opacity="0.3">
    <polygon points="50,80 51,84 55,85 51,86 50,90 49,86 45,85 49,84"/>
    <polygon points="150,80 151,84 155,85 151,86 150,90 149,86 145,85 149,84"/>
    <polygon points="50,185 51,189 55,190 51,191 50,195 49,191 45,190 49,189"/>
    <polygon points="150,185 151,189 155,190 151,191 150,195 149,191 145,190 149,189"/>
  </g>

  <!-- Motif central supérieur (rosace) -->
  <path d="M90,88 Q95,82 100,88 Q105,82 110,88" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>
  <path d="M90,172 Q95,178 100,172 Q105,178 110,172" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>
</svg>
