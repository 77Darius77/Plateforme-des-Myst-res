<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210" width="120" height="210">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="60%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="120" height="210" rx="6" ry="6" fill="url(#bgGrad)"/>

  <!-- Halos coins -->
  <rect x="-20" y="-20" width="70" height="70" fill="url(#cornerGlow)" opacity="0.4"/>
  <rect x="70" y="-20" width="70" height="70" fill="url(#cornerGlow)" opacity="0.4"/>
  <rect x="-20" y="160" width="70" height="70" fill="url(#cornerGlow)" opacity="0.4"/>
  <rect x="70" y="160" width="70" height="70" fill="url(#cornerGlow)" opacity="0.4"/>

  <!-- Halo central -->
  <rect width="120" height="210" fill="url(#centerGlow)"/>

  <!-- Bordures -->
  <rect x="3" y="3" width="114" height="204" rx="5" ry="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.7"/>
  <rect x="7" y="7" width="106" height="196" rx="3" ry="3" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>

  <!-- Étoiles de fond -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="15" cy="20" r="0.4" opacity="0.4"/><circle cx="34" cy="12" r="0.3" opacity="0.5"/>
    <circle cx="52" cy="18" r="0.5" opacity="0.3"/><circle cx="73" cy="9" r="0.3" opacity="0.6"/>
    <circle cx="89" cy="22" r="0.4" opacity="0.4"/><circle cx="105" cy="14" r="0.3" opacity="0.5"/>
    <circle cx="11" cy="45" r="0.3" opacity="0.3"/><circle cx="28" cy="38" r="0.5" opacity="0.5"/>
    <circle cx="44" cy="30" r="0.3" opacity="0.4"/><circle cx="63" cy="40" r="0.4" opacity="0.6"/>
    <circle cx="82" cy="33" r="0.3" opacity="0.3"/><circle cx="98" cy="44" r="0.5" opacity="0.5"/>
    <circle cx="110" cy="37" r="0.3" opacity="0.4"/><circle cx="19" cy="62" r="0.4" opacity="0.5"/>
    <circle cx="38" cy="55" r="0.3" opacity="0.3"/><circle cx="57" cy="68" r="0.5" opacity="0.6"/>
    <circle cx="76" cy="58" r="0.3" opacity="0.4"/><circle cx="94" cy="65" r="0.4" opacity="0.5"/>
    <circle cx="108" cy="60" r="0.3" opacity="0.3"/><circle cx="13" cy="82" r="0.5" opacity="0.4"/>
    <circle cx="31" cy="75" r="0.3" opacity="0.6"/><circle cx="49" cy="85" r="0.4" opacity="0.3"/>
    <circle cx="68" cy="78" r="0.3" opacity="0.5"/><circle cx="87" cy="88" r="0.5" opacity="0.4"/>
    <circle cx="103" cy="79" r="0.3" opacity="0.6"/><circle cx="16" cy="100" r="0.4" opacity="0.5"/>
    <circle cx="35" cy="108" r="0.3" opacity="0.3"/><circle cx="54" cy="100" r="0.5" opacity="0.4"/>
    <circle cx="72" cy="112" r="0.4" opacity="0.6"/><circle cx="91" cy="104" r="0.3" opacity="0.3"/>
    <circle cx="107" cy="110" r="0.5" opacity="0.5"/><circle cx="22" cy="122" r="0.3" opacity="0.4"/>
    <circle cx="41" cy="130" r="0.4" opacity="0.6"/><circle cx="60" cy="120" r="0.3" opacity="0.3"/>
    <circle cx="79" cy="128" r="0.5" opacity="0.5"/><circle cx="97" cy="118" r="0.3" opacity="0.4"/>
    <circle cx="112" cy="125" r="0.4" opacity="0.6"/><circle cx="17" cy="142" r="0.5" opacity="0.3"/>
    <circle cx="36" cy="150" r="0.3" opacity="0.5"/><circle cx="55" cy="140" r="0.4" opacity="0.4"/>
    <circle cx="74" cy="148" r="0.3" opacity="0.6"/><circle cx="93" cy="138" r="0.5" opacity="0.3"/>
    <circle cx="109" cy="145" r="0.3" opacity="0.5"/><circle cx="25" cy="162" r="0.4" opacity="0.4"/>
    <circle cx="43" cy="170" r="0.3" opacity="0.6"/><circle cx="62" cy="160" r="0.5" opacity="0.3"/>
    <circle cx="81" cy="168" r="0.4" opacity="0.5"/><circle cx="99" cy="158" r="0.3" opacity="0.4"/>
    <circle cx="114" cy="165" r="0.5" opacity="0.6"/><circle cx="20" cy="182" r="0.3" opacity="0.3"/>
    <circle cx="39" cy="188" r="0.4" opacity="0.5"/><circle cx="58" cy="178" r="0.3" opacity="0.4"/>
    <circle cx="77" cy="190" r="0.5" opacity="0.6"/><circle cx="96" cy="180" r="0.3" opacity="0.3"/>
    <circle cx="111" cy="186" r="0.4" opacity="0.5"/>
  </g>

  <!-- Motif central : heptagramme (7 branches pour les 7 planètes) -->
  <g transform="translate(60,105)" filter="url(#glow)">
    <!-- Branches du septénaire -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#10b981" stroke-width="0.5" opacity="0.6"/>
    <line x1="-28" y1="-10" x2="28" y2="10" stroke="#10b981" stroke-width="0.4" opacity="0.4"/>
    <line x1="28" y1="-10" x2="-28" y2="10" stroke="#10b981" stroke-width="0.4" opacity="0.4"/>
    <line x1="-17" y1="-24" x2="17" y2="24" stroke="#10b981" stroke-width="0.3" opacity="0.35"/>
    <line x1="17" y1="-24" x2="-17" y2="24" stroke="#10b981" stroke-width="0.3" opacity="0.35"/>

    <!-- Cercles concentriques -->
    <circle r="30" fill="none" stroke="#10b981" stroke-width="0.3" opacity="0.2"/>
    <circle r="22" fill="none" stroke="#10b981" stroke-width="0.4" opacity="0.3"/>
    <circle r="14" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.35"/>
    <circle r="7" fill="none" stroke="#10b981" stroke-width="0.4" opacity="0.5"/>

    <!-- Heptagramme stylisé -->
    <polygon points="0,-26 20.3,-8.3 24.2,12.4 7.4,24.7 -7.4,24.7 -24.2,12.4 -20.3,-8.3" fill="none" stroke="#d4af37" stroke-width="0.4" opacity="0.5"/>

    <!-- Œil central (symbole de voyance) -->
    <ellipse cx="0" cy="0" rx="5" ry="3" fill="none" stroke="#10b981" stroke-width="0.6" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#10b981" opacity="0.9"/>

    <!-- Points planétaires sur le cercle -->
    <circle cx="0" cy="-22" r="1" fill="#d4af37" opacity="0.7"/>
    <circle cx="20.9" cy="-7.2" r="1" fill="#d4af37" opacity="0.7"/>
    <circle cx="12.9" cy="17.8" r="1" fill="#d4af37" opacity="0.7"/>
    <circle cx="-12.9" cy="17.8" r="1" fill="#d4af37" opacity="0.7"/>
    <circle cx="-20.9" cy="-7.2" r="1" fill="#d4af37" opacity="0.7"/>
  </g>

  <!-- Petites étoiles dans les coins -->
  <g fill="#10b981" opacity="0.6" filter="url(#glow)">
    <g transform="translate(16,16)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#10b981" opacity="0.7"/>
    </g>
    <g transform="translate(104,16)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#10b981" opacity="0.7"/>
    </g>
    <g transform="translate(16,194)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#10b981" opacity="0.7"/>
    </g>
    <g transform="translate(104,194)">
      <polygon points="0,-4 0.5,-0.5 4,0 0.5,0.5 0,4 -0.5,0.5 -4,0 -0.5,-0.5" fill="#10b981" opacity="0.7"/>
    </g>
  </g>

  <!-- "BELLINE" discret -->
  <text x="60" y="192" text-anchor="middle" font-family="serif" font-size="5" fill="#10b981" opacity="0.5" letter-spacing="3">BELLINE</text>
</svg>
