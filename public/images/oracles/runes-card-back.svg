<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="300" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f131e"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3dd399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3dd399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="480" rx="12" fill="url(#bg)"/>
  <rect x="8" y="8" width="284" height="464" rx="10" fill="none" stroke="#dfb26c" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="150" cy="240" rx="140" ry="220" fill="url(#glow)"/>
  <!-- Yggdrasil simplified -->
  <g stroke="#dfb26c" stroke-width="1.2" fill="none" stroke-opacity="0.5">
    <line x1="150" y1="60" x2="150" y2="420"/>
    <path d="M150,100 Q80,180 60,280"/>
    <path d="M150,100 Q220,180 240,280"/>
    <path d="M150,200 Q80,280 70,360"/>
    <path d="M150,200 Q220,280 230,360"/>
    <path d="M150,280 Q100,340 90,420"/>
    <path d="M150,280 Q200,340 210,420"/>
    <!-- Roots -->
    <path d="M150,380 Q130,420 110,440"/>
    <path d="M150,380 Q150,420 150,445"/>
    <path d="M150,380 Q170,420 190,440"/>
  </g>
  <!-- Central rune circle -->
  <circle cx="150" cy="240" r="50" fill="none" stroke="#dfb26c" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="150" cy="240" r="42" fill="none" stroke="#dfb26c" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Runes around Yggdrasil -->
  <g font-family="serif" font-size="18" fill="#dfb26c" fill-opacity="0.6" text-anchor="middle">
    <text x="150" y="85">ᚠ</text>
    <text x="90" y="130">ᚢ</text>
    <text x="210" y="130">ᚦ</text>
    <text x="75" y="200">ᚨ</text>
    <text x="225" y="200">ᚱ</text>
    <text x="70" y="300">ᚲ</text>
    <text x="230" y="300">ᚷ</text>
    <text x="90" y="370">ᚹ</text>
    <text x="210" y="370">ᚺ</text>
    <text x="130" y="430">ᚾ</text>
    <text x="170" y="430">ᛁ</text>
  </g>
  <!-- Title -->
  <text x="150" y="465" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="2">FUTHARK ANCIEN</text>
</svg>
