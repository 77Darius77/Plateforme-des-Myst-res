<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 480" width="300" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="runeShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#dfb26c" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfb26c" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dfb26c" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="300" height="480" rx="12" fill="url(#bg)"/>
  <rect x="8" y="8" width="284" height="464" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="16" y="16" width="268" height="448" rx="8" fill="none" stroke="#dfb26c" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- Nordic knot corner ornaments -->
  <circle cx="24" cy="24" r="4" fill="none" stroke="#dfb26c" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="276" cy="24" r="4" fill="none" stroke="#dfb26c" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="24" cy="456" r="4" fill="none" stroke="#dfb26c" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="276" cy="456" r="4" fill="none" stroke="#dfb26c" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- Background glow -->
  <ellipse cx="150" cy="210" rx="120" ry="130" fill="url(#glow)"/>
  <!-- Rune character -->
  <text x="150" y="270" text-anchor="middle" font-family="serif" font-size="160" fill="#dfb26c" filter="url(#runeShadow)" letter-spacing="0">ᛇ</text>
  <!-- Bottom line -->
  <line x1="80" y1="320" x2="220" y2="320" stroke="#dfb26c" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Rune ID number -->
  <text x="150" y="360" text-anchor="middle" font-family="monospace" font-size="14" fill="#64748b" letter-spacing="2">13</text>
  <!-- Subtle nordic pattern -->
  <g stroke="#dfb26c" stroke-width="0.3" stroke-opacity="0.08" fill="none">
    <path d="M30,30 h8 v8 h-8 z M262,30 h8 v8 h-8 z M30,442 h8 v8 h-8 z M262,442 h8 v8 h-8 z"/>
  </g>
</svg>
