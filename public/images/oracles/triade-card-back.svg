<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#dfb26c"/>
      <stop offset="100%" stop-color="#c59750"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3bd3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3bd3ee" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.35">
      <stop offset="0%" stop-color="#dfb26c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="210" rx="6" fill="url(#bg)"/>

  <!-- Bordures -->
  <rect x="4" y="4" width="112" height="202" rx="5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <rect x="7" y="7" width="106" height="196" rx="4" fill="none" stroke="url(#cyanGrad)" stroke-width="0.5"/>

  <!-- Lueur centrale -->
  <ellipse cx="60" cy="85" rx="48" ry="58" fill="url(#glow)"/>

  <!-- Triangle — Triade -->
  <g transform="translate(60,80)" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85">
    <polygon points="0,-30 -26,18 26,18" fill="rgba(240,208,96,0.04)"/>
  </g>

  <!-- Point central lumineux -->
  <circle cx="60" cy="80" r="2.5" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- Texte -->
  <text x="60" y="148" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="url(#goldGrad)" letter-spacing="4" font-weight="bold">ORACLE</text>
  <text x="60" y="163" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="6" fill="url(#goldGrad)" letter-spacing="3" opacity="0.8">DE LA TRIADE</text>

  <!-- Bordure intérieure -->
  <rect x="10" y="10" width="100" height="190" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.25"/>
</svg>
