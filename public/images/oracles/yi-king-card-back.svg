<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </radialGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#daa520"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Fond -->
  <rect width="240" height="320" rx="10" fill="url(#g1)"/>
  <rect x="4" y="4" width="232" height="312" rx="8" fill="none" stroke="url(#g2)" stroke-width="1.5"/>
  <rect x="12" y="12" width="216" height="296" rx="4" fill="none" stroke="url(#g2)" stroke-width="0.5" opacity="0.5"/>

  <!-- Yin-Yang -->
  <circle cx="120" cy="120" r="55" fill="none" stroke="url(#g2)" stroke-width="2" filter="url(#glow)"/>
  <path d="M120,65 A55,55 0 0,1 120,175 A27.5,27.5 0 0,0 120,120 A27.5,27.5 0 0,1 120,65Z" fill="url(#g2)" opacity="0.7"/>
  <path d="M120,175 A55,55 0 0,1 120,65 A27.5,27.5 0 0,0 120,120 A27.5,27.5 0 0,1 120,175Z" fill="#1a1a2e"/>
  <circle cx="120" cy="92.5" r="8" fill="url(#g2)" opacity="0.8"/>
  <circle cx="120" cy="147.5" r="8" fill="#1a1a2e"/>

  <!-- Texte -->
  <text x="120" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#daa520" filter="url(#glow)">YI KING</text>
  <text x="120" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#daa520" opacity="0.7">Le Livre des</text>
  <text x="120" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#daa520" opacity="0.7">Mutations</text>

  <!-- Trigrammes décoratifs -->
  <g transform="translate(120,282)" opacity="0.4">
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#daa520" stroke-width="2"/>
    <line x1="-20" y1="-4" x2="20" y2="-4" stroke="#daa520" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#daa520" stroke-width="2"/>
  </g>
  <g transform="translate(120,296)" opacity="0.4">
    <line x1="-40" y1="-8" x2="40" y2="-8" stroke="#daa520" stroke-width="2"/>
    <line x1="-30" y1="-4" x2="-30" y2="-4" stroke="#daa520" stroke-width="2"/>
    <line x1="30" y1="-4" x2="30" y2="-4" stroke="#daa520" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#daa520" stroke-width="2"/>
  </g>

  <!-- Bordure trigrammes décoratifs -->
  <g opacity="0.15">
    <g transform="translate(30,30)"><line x1="-10" y1="-10" x2="10" y2="-10" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-6" x2="10" y2="-6" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-2" x2="10" y2="-2" stroke="#daa520" stroke-width="1"/></g>
    <g transform="translate(30,290)"><line x1="-10" y1="-10" x2="10" y2="-10" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-6" x2="10" y2="-6" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-2" x2="10" y2="-2" stroke="#daa520" stroke-width="1"/></g>
    <g transform="translate(210,30)"><line x1="-10" y1="-10" x2="10" y2="-10" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-6" x2="10" y2="-6" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-2" x2="10" y2="-2" stroke="#daa520" stroke-width="1"/></g>
    <g transform="translate(210,290)"><line x1="-10" y1="-10" x2="10" y2="-10" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-6" x2="10" y2="-6" stroke="#daa520" stroke-width="1"/><line x1="-10" y1="-2" x2="10" y2="-2" stroke="#daa520" stroke-width="1"/></g>
  </g>
</svg>
