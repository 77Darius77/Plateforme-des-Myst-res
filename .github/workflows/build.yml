name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # continue-on-error: le build (étape ci-dessus) reste bloquant.
      # La vérification de liens est actuellement informative car 5 liens
      # cassés préexistants (/blog/astrologie/, /blog/numerologie/) la font
      # échouer — à corriger séparément, puis retirer continue-on-error.
      - name: Check for broken internal links
        continue-on-error: true
        run: npx --yes linkinator@7 dist --recurse --skip "^(?!http://localhost)"
